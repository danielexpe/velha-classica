[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
resvg = { version = "0.49", default-features = false }
sha2 = "0.11"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
